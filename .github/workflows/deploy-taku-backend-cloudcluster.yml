name: Deploy TAKU Backend to CloudCluster

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "taku-deployment"
  push:
    branches:
      - taku-deployment
    paths:
      - "taku-backend/**"
      - "apps/service-ports.conf"
      - "apps/TAKU_BACKEND_SITE.conf"
      - "scripts/taku-service-helpers.sh"
      - "scripts/list-taku-services.sh"
      - "scripts/check-taku-service-config.sh"
      - "scripts/ensure-taku-service-certs.sh"
      - "scripts/enable-taku-nginx-sites.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-taku-backend-cloudcluster.yml"

concurrency:
  group: taku-backend-cloudcluster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudcluster

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Resolve CloudCluster deploy env
        id: cloudcluster
        env:
          BOT_PUSH_ENV_FILE: ${{ secrets.BOT_PUSH_ENV_FILE }}
          CLOUDCLUSTER_HOST: ${{ secrets.CLOUDCLUSTER_HOST }}
          CLOUDCLUSTER_USER: ${{ secrets.CLOUDCLUSTER_USER }}
          CLOUDCLUSTER_SSH_KEY: ${{ secrets.CLOUDCLUSTER_SSH_KEY }}
          CLOUDCLUSTER_SSH_PORT: ${{ secrets.CLOUDCLUSTER_SSH_PORT }}
          CLOUDCLUSTER_TAKU_BACKEND_DEPLOY_PATH: ${{ secrets.CLOUDCLUSTER_TAKU_BACKEND_DEPLOY_PATH }}
        run: |
          set -eu

          PUSH_ENV_FILE="$RUNNER_TEMP/taku-backend-push-env"
          printf '%s\n' "${BOT_PUSH_ENV_FILE:-}" > "$PUSH_ENV_FILE"

          read_push_value() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$PUSH_ENV_FILE"
          }

          read_push_ssh_key() {
            awk '
              /^CLOUDCLUSTER_SSH_KEY=-----BEGIN OPENSSH PRIVATE KEY-----/ {
                sub(/^CLOUDCLUSTER_SSH_KEY=/, "")
                capture = 1
              }
              capture { print }
              /^-----END OPENSSH PRIVATE KEY-----/ { exit }
            ' "$PUSH_ENV_FILE"
          }

          HOST="${CLOUDCLUSTER_HOST:-$(read_push_value CLOUDCLUSTER_HOST)}"
          USER="${CLOUDCLUSTER_USER:-$(read_push_value CLOUDCLUSTER_USER)}"
          PORT="${CLOUDCLUSTER_SSH_PORT:-$(read_push_value CLOUDCLUSTER_SSH_PORT)}"
          SSH_KEY="${CLOUDCLUSTER_SSH_KEY:-$(read_push_ssh_key)}"
          DEPLOY_PATH="${CLOUDCLUSTER_TAKU_BACKEND_DEPLOY_PATH:-$(read_push_value CLOUDCLUSTER_TAKU_BACKEND_DEPLOY_PATH)}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/taku-backend}"
          PORT="${PORT:-22}"
          PORT="$(printf '%s' "$PORT" | tr -d '\r' | xargs)"

          missing=0
          for name in HOST USER SSH_KEY DEPLOY_PATH; do
            value="$(eval "printf '%s' \"\${$name:-}\"")"
            if [ -z "$value" ]; then
              echo "::error::$name is missing"
              missing=1
            else
              echo "$name is configured (length: ${#value})"
            fi
          done

          case "$PORT" in
            ''|*[!0-9]*)
              echo "::error::CLOUDCLUSTER_SSH_PORT must be numeric. Check the direct secret first, then BOT_PUSH_ENV_FILE fallback."
              echo "Resolved port length: ${#PORT}"
              exit 1
              ;;
          esac

          echo "PORT is configured: $PORT"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          echo "::add-mask::$SSH_KEY"
          echo "::add-mask::$DEPLOY_PATH"
          printf '%s\n' "$SSH_KEY" | while IFS= read -r line; do
            [ -z "$line" ] || echo "::add-mask::$line"
          done

          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "port=$PORT"
            echo "deploy_path=$DEPLOY_PATH"
            echo "ssh_key<<EOF"
            printf '%s\n' "$SSH_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @taku/backend typecheck

      - name: Build
        run: pnpm --filter @taku/backend build

      - name: Write service env file
        env:
          TAKU_BACKEND_ENV_FILE: ${{ secrets.TAKU_BACKEND_ENV_FILE }}
        run: |
          set -eu
          if [ -z "${TAKU_BACKEND_ENV_FILE:-}" ]; then
            echo "::error::TAKU_BACKEND_ENV_FILE is missing"
            exit 1
          fi

          printf '%s\n' "$TAKU_BACKEND_ENV_FILE" > taku-backend/.env
          chmod 600 taku-backend/.env
          echo "Generated taku-backend/.env"
          wc -c taku-backend/.env

          for name in TAKU_BACKEND_JWT_SECRET TAKU_BACKEND_REFRESH_SECRET; do
            if grep -q "^$name=" taku-backend/.env; then
              value="$(grep "^$name=" taku-backend/.env | tail -1 | cut -d= -f2-)"
              echo "$name present (length: ${#value})"
            else
              echo "::error::$name is missing from TAKU_BACKEND_ENV_FILE"
              exit 1
            fi
          done

      - name: Prepare release bundle
        run: |
          set -eux
          mkdir -p /tmp/taku-backend-release
          rsync -a \
            --exclude ".env.example" \
            --exclude "data" \
            --exclude "dist" \
            --exclude "node_modules" \
            taku-backend/ /tmp/taku-backend-release/
          tar -czf taku-backend-release.tar.gz -C /tmp taku-backend-release
          ls -lh taku-backend-release.tar.gz

      - name: Prepare nginx bundle
        run: |
          set -eux
          mkdir -p /tmp/taku-backend-infra/apps /tmp/taku-backend-infra/scripts
          cp apps/service-ports.conf /tmp/taku-backend-infra/apps/service-ports.conf
          cp apps/TAKU_BACKEND_SITE.conf /tmp/taku-backend-infra/apps/TAKU_BACKEND_SITE.conf
          cp scripts/taku-service-helpers.sh /tmp/taku-backend-infra/scripts/taku-service-helpers.sh
          cp scripts/list-taku-services.sh /tmp/taku-backend-infra/scripts/list-taku-services.sh
          cp scripts/check-taku-service-config.sh /tmp/taku-backend-infra/scripts/check-taku-service-config.sh
          cp scripts/ensure-taku-service-certs.sh /tmp/taku-backend-infra/scripts/ensure-taku-service-certs.sh
          cp scripts/enable-taku-nginx-sites.sh /tmp/taku-backend-infra/scripts/enable-taku-nginx-sites.sh
          chmod +x /tmp/taku-backend-infra/scripts/*.sh
          tar -czf taku-backend-infra.tar.gz -C /tmp taku-backend-infra
          ls -lh taku-backend-infra.tar.gz

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          source: taku-backend-release.tar.gz
          target: /tmp
          debug: true

      - name: Upload nginx bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          source: taku-backend-infra.tar.gz
          target: /tmp
          debug: true

      - name: Deploy on CloudCluster
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ steps.cloudcluster.outputs.deploy_path }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          SUDO_PASSWORD: ${{ secrets.CLOUDCLUSTER_SUDO_PASSWORD }}
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          envs: DEPLOY_PATH,CERTBOT_EMAIL,SUDO_PASSWORD
          timeout: 60s
          command_timeout: 15m
          request_pty: true
          debug: true
          script: |
            set -eu
            LOG_FILE="/tmp/taku-backend-deploy.log"
            : > "$LOG_FILE"

            run_deploy() {
              : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

              run_sudo() {
                if [ "$(id -u)" -eq 0 ]; then
                  "$@"
                elif [ -n "${SUDO_PASSWORD:-}" ]; then
                  printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
                else
                  sudo "$@"
                fi
              }

              echo "Remote user: $(whoami)"
              echo "Remote host: $(hostname)"
              df -h .
              free -h || true
              ls -lh /tmp/taku-backend-release.tar.gz /tmp/taku-backend-infra.tar.gz

              if command -v apt-get >/dev/null 2>&1; then
                run_sudo apt-get update
                run_sudo apt-get install -y nginx certbot python3-certbot-nginx
              fi

              rm -rf /tmp/taku-backend-infra
              tar -xzf /tmp/taku-backend-infra.tar.gz -C /tmp
              (
                cd /tmp/taku-backend-infra
                TAKU_SERVICES="TAKU_BACKEND" TAKU_CREATE_MISSING_SERVICE_PATHS=true scripts/check-taku-service-config.sh
                TAKU_SERVICES="TAKU_BACKEND" scripts/list-taku-services.sh
                run_sudo env TAKU_SERVICES="TAKU_BACKEND" CERTBOT_EMAIL="${CERTBOT_EMAIL:-admin@taku.lat}" scripts/ensure-taku-service-certs.sh
                run_sudo env TAKU_SERVICES="TAKU_BACKEND" DEBUG=true scripts/enable-taku-nginx-sites.sh
              )

              mkdir -p "$DEPLOY_PATH"
              tar -xzf /tmp/taku-backend-release.tar.gz -C "$DEPLOY_PATH" --strip-components=1
              cd "$DEPLOY_PATH"
              mkdir -p data

              node --version || true
              if command -v corepack >/dev/null 2>&1; then
                corepack enable
                corepack prepare pnpm@9.15.5 --activate
              fi
              pnpm --version
              pnpm install --prod=false --no-frozen-lockfile
              pnpm build
              pnpm exec pm2 delete taku-backend || true
              PORT=3110 pnpm exec pm2 start dist/index.js --name taku-backend --update-env
              pnpm exec pm2 save
              pnpm exec pm2 describe taku-backend
              pnpm exec pm2 status
            }

            set +e
            ( set -eu; run_deploy ) > "$LOG_FILE" 2>&1
            DEPLOY_STATUS="$?"
            set -e

            echo "Remote deploy log:"
            cat "$LOG_FILE"
            exit "$DEPLOY_STATUS"
