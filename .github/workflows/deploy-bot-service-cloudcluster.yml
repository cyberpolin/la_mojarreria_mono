name: Deploy Bot Service to CloudCluster

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        default: "taku-deployment"
  push:
    branches:
      - taku-deployment
    paths:
      - "apps/bot-service/**"
      - "apps/service-ports.conf"
      - "apps/TAKU_BOT_SERVICE_SITE.conf"
      - "scripts/taku-service-helpers.sh"
      - "scripts/list-taku-services.sh"
      - "scripts/check-taku-service-config.sh"
      - "scripts/ensure-taku-service-certs.sh"
      - "scripts/enable-taku-nginx-sites.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-bot-service-cloudcluster.yml"

concurrency:
  group: bot-service-cloudcluster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudcluster

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Resolve CloudCluster deploy env
        id: cloudcluster
        env:
          BOT_SERVICE_ENV_FILE: ${{ secrets.BOT_SERVICE_ENV_FILE }}
          BOT_PUSH_ENV_FILE: ${{ secrets.BOT_PUSH_ENV_FILE }}
          CLOUDCLUSTER_HOST: ${{ secrets.CLOUDCLUSTER_HOST }}
          CLOUDCLUSTER_USER: ${{ secrets.CLOUDCLUSTER_USER }}
          CLOUDCLUSTER_SSH_KEY: ${{ secrets.CLOUDCLUSTER_SSH_KEY }}
          CLOUDCLUSTER_SSH_PORT: ${{ secrets.CLOUDCLUSTER_SSH_PORT }}
        run: |
          set -eu

          PUSH_ENV_FILE="$RUNNER_TEMP/bot-push-env"
          printf '%s\n' "${BOT_PUSH_ENV_FILE:-}" > "$PUSH_ENV_FILE"

          read_push_value() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$PUSH_ENV_FILE"
          }

          read_push_ssh_key() {
            awk '
              /^CLOUDCLUSTER_SSH_KEY=-----BEGIN OPENSSH PRIVATE KEY-----/ {
                sub(/^CLOUDCLUSTER_SSH_KEY=/, "")
                capture = 1
              }
              capture { print }
              /^-----END OPENSSH PRIVATE KEY-----/ { exit }
            ' "$PUSH_ENV_FILE"
          }

          HOST="${CLOUDCLUSTER_HOST:-$(read_push_value CLOUDCLUSTER_HOST)}"
          USER="${CLOUDCLUSTER_USER:-$(read_push_value CLOUDCLUSTER_USER)}"
          PORT="${CLOUDCLUSTER_SSH_PORT:-$(read_push_value CLOUDCLUSTER_SSH_PORT)}"
          SSH_KEY="${CLOUDCLUSTER_SSH_KEY:-$(read_push_ssh_key)}"
          DEPLOY_PATH="$(read_push_value CLOUDCLUSTER_BOT_SERVICE_DEPLOY_PATH)"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/bot-service}"
          PORT="${PORT:-22}"
          PORT="$(printf '%s' "$PORT" | tr -d '\r' | xargs)"

          print_debug_value() {
            label="$1"
            value="$2"
            printf '%s debug chars: ' "$label"
            printf '%s' "$value" | sed 's/./& /g'
            printf '\n'
          }

          echo "Resolved CloudCluster connection source:"
          if [ -n "${CLOUDCLUSTER_HOST:-}" ]; then echo "HOST source: direct secret"; else echo "HOST source: BOT_PUSH_ENV_FILE"; fi
          if [ -n "${CLOUDCLUSTER_USER:-}" ]; then echo "USER source: direct secret"; else echo "USER source: BOT_PUSH_ENV_FILE"; fi
          if [ -n "${CLOUDCLUSTER_SSH_PORT:-}" ]; then echo "PORT source: direct secret"; else echo "PORT source: BOT_PUSH_ENV_FILE/default"; fi
          if [ -n "${CLOUDCLUSTER_SSH_KEY:-}" ]; then echo "SSH_KEY source: direct secret"; else echo "SSH_KEY source: BOT_PUSH_ENV_FILE"; fi
          echo "HOST resolved: $HOST"
          echo "USER resolved: $USER"
          echo "PORT resolved: $PORT"
          echo "DEPLOY_PATH resolved: $DEPLOY_PATH"
          print_debug_value "HOST" "$HOST"
          print_debug_value "USER" "$USER"
          print_debug_value "PORT" "$PORT"
          print_debug_value "DEPLOY_PATH" "$DEPLOY_PATH"
          echo "SSH_KEY length: ${#SSH_KEY}"
          if [ -n "$SSH_KEY" ]; then
            SSH_KEY_FILE="$RUNNER_TEMP/cloudcluster-key-check"
            printf '%s\n' "$SSH_KEY" > "$SSH_KEY_FILE"
            chmod 600 "$SSH_KEY_FILE"
            if ssh-keygen -y -f "$SSH_KEY_FILE" >/dev/null 2>&1; then
              echo "SSH_KEY parse: ok"
              ssh-keygen -y -f "$SSH_KEY_FILE" | ssh-keygen -lf - | sed 's/^/SSH_KEY public fingerprint: /'
            else
              echo "::error::SSH_KEY parse failed; CLOUDCLUSTER_SSH_KEY is not a valid private key or is malformed"
              exit 1
            fi
          fi

          missing=0
          for name in BOT_SERVICE_ENV_FILE HOST USER SSH_KEY DEPLOY_PATH; do
            value="$(eval "printf '%s' \"\${$name:-}\"")"
            if [ -z "$value" ]; then
              echo "::error::$name is missing"
              missing=1
            else
              echo "$name is configured (length: ${#value})"
            fi
          done

          case "$PORT" in
            ''|*[!0-9]*)
              echo "::error::CLOUDCLUSTER_SSH_PORT must be numeric. Check the direct secret first, then BOT_PUSH_ENV_FILE fallback."
              echo "Resolved port length: ${#PORT}"
              exit 1
              ;;
          esac

          echo "PORT is configured: $PORT"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          echo "::add-mask::$SSH_KEY"
          echo "::add-mask::$DEPLOY_PATH"
          printf '%s\n' "$SSH_KEY" | while IFS= read -r line; do
            [ -z "$line" ] || echo "::add-mask::$line"
          done

          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "port=$PORT"
            echo "deploy_path=$DEPLOY_PATH"
            echo "ssh_key<<EOF"
            printf '%s\n' "$SSH_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: SSH preflight
        id: ssh_preflight
        env:
          SSH_HOST: ${{ steps.cloudcluster.outputs.host }}
          SSH_USER: ${{ steps.cloudcluster.outputs.user }}
          SSH_PORT: ${{ steps.cloudcluster.outputs.port }}
          SSH_KEY: ${{ steps.cloudcluster.outputs.ssh_key }}
        run: |
          set -eu

          KEY_FILE="$RUNNER_TEMP/cloudcluster-preflight-key"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          print_debug_value() {
            label="$1"
            value="$2"
            printf '%s debug chars: ' "$label"
            printf '%s' "$value" | sed 's/./& /g'
            printf '\n'
          }

          echo "SSH preflight target: $SSH_USER@$SSH_HOST:$SSH_PORT"
          print_debug_value "SSH_HOST" "$SSH_HOST"
          print_debug_value "SSH_USER" "$SSH_USER"
          print_debug_value "SSH_PORT" "$SSH_PORT"
          echo "SSH preflight key length: ${#SSH_KEY}"
          ssh-keygen -y -f "$KEY_FILE" | ssh-keygen -lf - | sed 's/^/SSH preflight public fingerprint: /'

          SSH_OUTPUT="$RUNNER_TEMP/ssh-preflight-output.log"
          set +e
          ssh -vvv \
            -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "echo ssh-preflight-ok" 2>&1 | tee "$SSH_OUTPUT"
          SSH_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$SSH_STATUS" -ne 0 ]; then
            if grep -qi "Connection timed out" "$SSH_OUTPUT"; then
              echo "::error::SSH preflight failed: connection timed out. Host/port is unreachable from GitHub Actions."
            elif grep -qi "Permission denied" "$SSH_OUTPUT"; then
              echo "::error::SSH preflight failed: permission denied. The server rejected the key for this user."
            else
              echo "::error::SSH preflight failed. Check the ssh -vvv output above."
            fi
            exit "$SSH_STATUS"
          fi

      - name: Typecheck
        run: pnpm --filter @mojarreria/bot-service typecheck

      - name: Build
        run: |
          pnpm --filter @mojarreria/bot-service build
          find apps/bot-service/dist -maxdepth 2 -type f -print

      - name: Write service env file
        env:
          BOT_SERVICE_ENV_FILE: ${{ secrets.BOT_SERVICE_ENV_FILE }}
        run: |
          set -eu
          if [ -n "${BOT_SERVICE_ENV_FILE:-}" ]; then
            printf '%s\n' "$BOT_SERVICE_ENV_FILE" > apps/bot-service/.env
            chmod 600 apps/bot-service/.env
          else
            echo "::error::BOT_SERVICE_ENV_FILE is missing"
            exit 1
          fi

          echo "Generated apps/bot-service/.env"
          wc -c apps/bot-service/.env
          for name in BOT_SERVICE_API_KEY DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL; do
            if grep -q "^$name=" apps/bot-service/.env; then
              value="$(grep "^$name=" apps/bot-service/.env | tail -1 | cut -d= -f2-)"
              echo "$name present (length: ${#value})"
            else
              echo "::error::$name is missing from BOT_SERVICE_ENV_FILE"
              exit 1
            fi
          done

          node -e "import('./apps/bot-service/dist/config.js').then(({config}) => console.log(JSON.stringify({host: config.host, port: config.port, deepseekBaseUrl: config.deepseekBaseUrl, deepseekModel: config.deepseekModel, apiKeyLength: config.apiKey.length, deepseekApiKeyLength: config.deepseekApiKey.length})))"

      - name: Prepare release bundle
        run: |
          set -eux
          mkdir -p /tmp/mojarreria-bot-service
          rsync -a \
            --exclude ".env.example" \
            --exclude "data" \
            --exclude "dist" \
            --exclude "node_modules" \
            apps/bot-service/ /tmp/mojarreria-bot-service/
          tar -czf mojarreria-bot-service.tar.gz -C /tmp mojarreria-bot-service
          ls -lh mojarreria-bot-service.tar.gz

      - name: Prepare nginx bundle
        run: |
          set -eux
          mkdir -p /tmp/taku-bot-service-infra/apps /tmp/taku-bot-service-infra/scripts
          cp apps/service-ports.conf /tmp/taku-bot-service-infra/apps/service-ports.conf
          cp apps/TAKU_BOT_SERVICE_SITE.conf /tmp/taku-bot-service-infra/apps/TAKU_BOT_SERVICE_SITE.conf
          cp scripts/taku-service-helpers.sh /tmp/taku-bot-service-infra/scripts/taku-service-helpers.sh
          cp scripts/list-taku-services.sh /tmp/taku-bot-service-infra/scripts/list-taku-services.sh
          cp scripts/check-taku-service-config.sh /tmp/taku-bot-service-infra/scripts/check-taku-service-config.sh
          cp scripts/ensure-taku-service-certs.sh /tmp/taku-bot-service-infra/scripts/ensure-taku-service-certs.sh
          cp scripts/enable-taku-nginx-sites.sh /tmp/taku-bot-service-infra/scripts/enable-taku-nginx-sites.sh
          chmod +x /tmp/taku-bot-service-infra/scripts/*.sh
          tar -czf taku-bot-service-infra.tar.gz -C /tmp taku-bot-service-infra
          ls -lh taku-bot-service-infra.tar.gz

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          source: mojarreria-bot-service.tar.gz
          target: /tmp
          debug: true

      - name: Upload nginx bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          source: taku-bot-service-infra.tar.gz
          target: /tmp
          debug: true

      - name: SSH smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          timeout: 60s
          command_timeout: 2m
          request_pty: true
          debug: true
          script: |
            set -eu
            echo "SSH smoke test started"
            whoami
            hostname
            pwd
            echo "SSH smoke test finished"

      - name: Deploy on CloudCluster
        id: deploy_ssh
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ steps.cloudcluster.outputs.deploy_path }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          SUDO_PASSWORD: ${{ secrets.CLOUDCLUSTER_SUDO_PASSWORD }}
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          envs: DEPLOY_PATH,CERTBOT_EMAIL,SUDO_PASSWORD
          timeout: 60s
          command_timeout: 15m
          request_pty: true
          debug: true
          script: |
            set -eu
            LOG_FILE="/tmp/mojarreria-bot-service-deploy.log"
            : > "$LOG_FILE"
            echo "Deploy wrapper started at $(date -Is)" >> "$LOG_FILE"

            run_deploy() {
            : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

            run_sudo() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              elif [ -n "${SUDO_PASSWORD:-}" ]; then
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
              else
                sudo "$@"
              fi
            }

            wait_for_apt_locks() {
              if ! command -v fuser >/dev/null 2>&1; then
                return 0
              fi

              attempts=0
              while fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -gt 60 ]; then
                  echo "Timed out waiting for apt/dpkg locks"
                  run_sudo fuser -v /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock || true
                  return 1
                fi
                echo "Waiting for apt/dpkg lock to be released ($attempts/60)"
                sleep 5
              done
            }

            echo "Remote user: $(whoami)"
            echo "Remote host: $(hostname)"
            echo "Deploy path: configured"
            echo "Initial directory: $(pwd)"
            df -h .
            free -h || true
            ls -lh /tmp/mojarreria-bot-service.tar.gz
            ls -lh /tmp/taku-bot-service-infra.tar.gz

            echo "Installing nginx/certbot dependencies if needed"
            if command -v apt-get >/dev/null 2>&1; then
              wait_for_apt_locks
              run_sudo apt-get update
              wait_for_apt_locks
              run_sudo apt-get install -y nginx certbot python3-certbot-nginx
            fi

            rm -rf /tmp/taku-bot-service-infra
            tar -xzf /tmp/taku-bot-service-infra.tar.gz -C /tmp
            (
              cd /tmp/taku-bot-service-infra
              echo "Checking standalone bot-service nginx config"
              TAKU_SERVICES="TAKU_BOT_SERVICE" TAKU_CREATE_MISSING_SERVICE_PATHS=true scripts/check-taku-service-config.sh
              TAKU_SERVICES="TAKU_BOT_SERVICE" scripts/list-taku-services.sh
              echo "Ensuring standalone bot-service certificate"
              run_sudo env TAKU_SERVICES="TAKU_BOT_SERVICE" CERTBOT_EMAIL="${CERTBOT_EMAIL:-admin@taku.lat}" scripts/ensure-taku-service-certs.sh
              echo "Enabling standalone bot-service nginx site"
              run_sudo env TAKU_SERVICES="TAKU_BOT_SERVICE" DEBUG=true scripts/enable-taku-nginx-sites.sh
            )

            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            echo "NVM_DIR: $NVM_DIR"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deploy directory does not exist; creating it"
              if mkdir -p "$DEPLOY_PATH" 2>/dev/null; then
                echo "Deploy directory created without sudo"
              elif command -v sudo >/dev/null 2>&1; then
                sudo mkdir -p "$DEPLOY_PATH"
                sudo chown "$(id -u):$(id -g)" "$DEPLOY_PATH"
                echo "Deploy directory created with sudo and ownership assigned"
              else
                echo "Cannot create $DEPLOY_PATH and sudo is unavailable"
                return 1
              fi
            fi

            if [ ! -w "$DEPLOY_PATH" ]; then
              echo "Deploy directory is not writable; attempting ownership fix"
              if command -v sudo >/dev/null 2>&1; then
                sudo chown "$(id -u):$(id -g)" "$DEPLOY_PATH"
              else
                echo "Cannot write to $DEPLOY_PATH and sudo is unavailable"
                return 1
              fi
            fi

            tar -xzf /tmp/mojarreria-bot-service.tar.gz -C "$DEPLOY_PATH" --strip-components=1
            cd "$DEPLOY_PATH"
            echo "Extracted directory: $(pwd)"
            ls -la
            cat package.json
            cat tsconfig.json
            if [ -f .env ]; then
              echo "Remote .env exists"
              wc -c .env
              for name in BOT_SERVICE_API_KEY DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL; do
                if grep -q "^$name=" .env; then
                  value="$(grep "^$name=" .env | tail -1 | cut -d= -f2-)"
                  echo "Remote $name present (length: ${#value})"
                else
                  echo "Remote $name missing"
                  return 1
                fi
              done
            else
              echo "Remote .env missing"
              return 1
            fi

            if command -v nvm >/dev/null 2>&1; then
              echo "Using nvm command from shell"
              nvm install 20.19.4
              nvm use 20.19.4
            elif [ -s "$NVM_DIR/nvm.sh" ]; then
              echo "Loading nvm for Node setup"
              set +e
              set +u
              . "$NVM_DIR/nvm.sh"
              NVM_LOAD_STATUS="$?"
              set -u
              set -e
              if [ "$NVM_LOAD_STATUS" -eq 0 ] && command -v nvm >/dev/null 2>&1; then
                nvm install 20.19.4
                nvm use 20.19.4
              else
                echo "nvm load failed; using existing system node"
              fi
            else
              echo "nvm.sh not found; using system node"
            fi

            node --version
            PNPM_CMD="pnpm"
            if command -v pnpm >/dev/null 2>&1; then
              echo "Using existing pnpm"
            elif command -v corepack >/dev/null 2>&1; then
              echo "Preparing pnpm with corepack without global enable"
              if corepack prepare pnpm@9.15.5 --activate && corepack pnpm --version >/dev/null 2>&1; then
                PNPM_CMD="corepack pnpm"
              else
                PNPM_CMD="npx pnpm@9.15.5"
              fi
            else
              echo "corepack not found; using npx pnpm"
              PNPM_CMD="npx pnpm@9.15.5"
            fi

            $PNPM_CMD --version
            $PNPM_CMD config get store-dir

            $PNPM_CMD install --prod=false --no-frozen-lockfile
            $PNPM_CMD exec tsc --version
            $PNPM_CMD list --depth 0 || true
            du -sh node_modules 2>/dev/null || true
            $PNPM_CMD build
            find dist -maxdepth 2 -type f -print
            mkdir -p data
            PM2_CMD="$PNPM_CMD dlx pm2@5.4.3"
            PORT=3140 $PM2_CMD startOrReload ecosystem.config.cjs --env production --update-env
            $PM2_CMD save
            $PM2_CMD status
            }

            set +e
            ( set -eu; run_deploy ) >> "$LOG_FILE" 2>&1
            DEPLOY_STATUS="$?"
            set -e

            echo "Remote deploy log:"
            cat "$LOG_FILE"
            exit "$DEPLOY_STATUS"

      - name: Fetch remote deploy log
        if: always() && steps.ssh_preflight.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.cloudcluster.outputs.host }}
          username: ${{ steps.cloudcluster.outputs.user }}
          key: ${{ steps.cloudcluster.outputs.ssh_key }}
          port: ${{ steps.cloudcluster.outputs.port }}
          timeout: 120s
          command_timeout: 2m
          request_pty: true
          debug: true
          script: |
            set -eu
            echo "Remote deploy log:"
            if [ -f /tmp/mojarreria-bot-service-deploy.log ]; then
              cat /tmp/mojarreria-bot-service-deploy.log
            else
              echo "No remote deploy log file found"
            fi
