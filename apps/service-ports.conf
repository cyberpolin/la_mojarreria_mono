# TAKU public marketing site and unified frontend shell.
# Serves the public landing page, signup/login, Super Admin UI, and client UI.
TAKU_WEB_PORT=3100
TAKU_WEB_DOMAIN=taku.lat
TAKU_WEB_PATH=/apps/taku-site

# TAKU unified backend API.
# Owns auth, Super Admin APIs, client/workspace APIs, orchestration, and persistence.
TAKU_BACKEND_PORT=3110
TAKU_BACKEND_DOMAIN=api.taku.lat
TAKU_BACKEND_PATH=/taku-backend

# TAKU WhatsApp admin web UI.
# Client-facing UI for managing WhatsApp connections, QR pairing, phones, and schedules.
TAKU_WA_WEB_PORT=3120
TAKU_WA_WEB_DOMAIN=wa.taku.lat
TAKU_WA_WEB_PATH=/apps/taku-wa-web

# TAKU WhatsApp connection service.
# Backend service that owns WhatsApp/Baileys sessions, QR lifecycle, and message transport.
TAKU_WA_SERVICE_PORT=3130
TAKU_WA_SERVICE_DOMAIN=api.wa.taku.lat
TAKU_WA_SERVICE_PATH=/apps/wa-service

# TAKU Bot API service.
# Backend service for assistants, chat completions, usage, billing credits, and provider calls.
TAKU_BOT_SERVICE_PORT=3140
TAKU_BOT_SERVICE_DOMAIN=api.bot.taku.lat
TAKU_BOT_SERVICE_PATH=/apps/bot-service

# TAKU Bot admin web UI.
# Client-facing UI for assistants, completion testing, usage, and bot billing.
TAKU_BOT_WEB_PORT=3150
TAKU_BOT_WEB_DOMAIN=bot.taku.lat
TAKU_BOT_WEB_PATH=/apps/taku-bot-web
